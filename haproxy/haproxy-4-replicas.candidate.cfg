global
    log stdout format raw local0

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s
    accepted_payload_size 8192

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend stats
    bind *:8888
    stats enable
    stats uri /
    stats refresh 5s

frontend http_in
    bind *:80
    acl p_usuarios path_beg /usuarios /api/usuarios
    acl p_apuestas path_beg /apuestas /api/apuestas
    acl p_partidos path_beg /partidos /api/partidos
    acl p_dinero   path_beg /dinero /api/dinero
    acl p_equipos  path_beg /equipos /api/equipos
    use_backend be_usuarios if p_usuarios
    use_backend be_apuestas if p_apuestas
    use_backend be_partidos if p_partidos
    use_backend be_dinero   if p_dinero
    use_backend be_equipos  if p_equipos
    default_backend be_usuarios
    http-response set-header X-Replica %s

backend be_usuarios
    balance roundrobin
    http-request replace-path ^/usuarios(/)?(.*) /\2
    server-template usuarios 4 tasks.novatix_stack_usuarios:3001 check resolvers docker resolve-prefer ipv4 init-addr none

backend be_apuestas
    balance roundrobin
    http-request replace-path ^/apuestas(/)?(.*) /\2
    server-template apuestas 4 tasks.novatix_stack_apuestas:3000 check resolvers docker resolve-prefer ipv4 init-addr none

backend be_partidos
    balance roundrobin
    http-request replace-path ^/partidos(/)?(.*) /\2
    server-template partidos 4 tasks.novatix_stack_partidos:3002 check resolvers docker resolve-prefer ipv4 init-addr none

backend be_dinero
    balance roundrobin
    http-request replace-path ^/dinero(/)?(.*) /\2
    server-template dinero 4 tasks.novatix_stack_dinero:3003 check resolvers docker resolve-prefer ipv4 init-addr none

backend be_equipos
    balance roundrobin
    http-request replace-path ^/equipos(/)?(.*) /\2
    server-template equipos 4 tasks.novatix_stack_equipos:3004 check resolvers docker resolve-prefer ipv4 init-addr none
