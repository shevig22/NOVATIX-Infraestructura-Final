# Apache NOVATIX — proxy del dashboard Spark V2
# Copia orientativa basada en S2, 20/11/2026.
# SOLO para laboratorio privado y tras configurar una autenticación/autoriza-
# ción en servidor si se pretende limitar el acceso al dashboard.
# Requiere apache2 módulos proxy y proxy_http habilitados.
# La ubicación /novatix-spark-api/ es accesible sin autenticar en el diseño S2;
# NO exponer por Internet en este estado.

ProxyPass "/novatix-spark-api/" "http://192.168.100.3:8090/api/spark/" connectiontimeout=5 timeout=20
ProxyPassReverse "/novatix-spark-api/" "http://192.168.100.3:8090/api/spark/"
