# NOVATIX - VirtualHost MODELO para instalar en un laboratorio NUEVO
# NO se extrajo del Apache original de Ubuntu1. Es una plantilla de reproducción
# propuesta según rutas relativas del frontend y HAProxy V4. SIN VALIDAR EN VM NUEVA.
# Red privada prevista: Ubuntu1 .2, HAProxy Ubuntu2 .3:8080
# Requiere: sudo a2enmod proxy proxy_http
# No es apto para acceso publico; no incluye TLS ni autenticacion en backend.

<VirtualHost *:80>
    ServerName novatix.local
    DocumentRoot /var/www/html2

    <Directory "/var/www/html2">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Conservar los prefijos: HAProxy los elimina antes de reenviar a la API.
    ProxyPass        "/usuarios/" "http://192.168.100.3:8080/usuarios/" connectiontimeout=5 timeout=40
    ProxyPassReverse "/usuarios/" "http://192.168.100.3:8080/usuarios/"
    ProxyPass        "/equipos/"  "http://192.168.100.3:8080/equipos/"  connectiontimeout=5 timeout=40
    ProxyPassReverse "/equipos/"  "http://192.168.100.3:8080/equipos/"
    ProxyPass        "/partidos/" "http://192.168.100.3:8080/partidos/" connectiontimeout=5 timeout=40
    ProxyPassReverse "/partidos/" "http://192.168.100.3:8080/partidos/"
    ProxyPass        "/apuestas/" "http://192.168.100.3:8080/apuestas/" connectiontimeout=5 timeout=40
    ProxyPassReverse "/apuestas/" "http://192.168.100.3:8080/apuestas/"
    ProxyPass        "/dinero/"   "http://192.168.100.3:8080/dinero/"   connectiontimeout=5 timeout=40
    ProxyPassReverse "/dinero/"   "http://192.168.100.3:8080/dinero/"

    ErrorLog ${APACHE_LOG_DIR}/novatix-laboratorio-error.log
    CustomLog ${APACHE_LOG_DIR}/novatix-laboratorio-access.log combined
</VirtualHost>
